<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Drift Explorer model check</title>
</head>
<body>
  <!-- Runs app/js/model.js on app/data/app_data.js (every set and variant, all year and two seasons) and prints the
       results as JSON, for tests/test_app.py to compare with Python (headless Chrome, --dump-dom). -->
  <pre id="out">pending</pre>
  <script src="../app/data/app_data.js"></script>
  <script src="../app/js/model.js"></script>
  <script>
    (function () {
      const out = document.getElementById("out");
      try {
        const starts = [{ kind: "coast" }, ...[103, 198, 317, 353, 368, 547, 122].map((cell) => ({ kind: "cell", cell }))];
        const few = starts.slice(0, 3), steps = [1, 6, 7, 24, 72], results = [];
        let cellOf = null;
        for (const set of ["all", "undrogued"]) {
          for (const variant of ["water", "shore"]) {
            const M = new DriftModel.Model(window.DRIFT_DATA, variant, set);
            cellOf = M.cellOf(-28.0, 14.0);
            for (const [season, from] of [[null, starts], [0, few], [2, few]]) {
              results.push({
                set, variant, season, n_states: M.nStates,
                starts: from.map((start) => {
                  const x0 = M.startVector(start), dists = M.propagate(x0, Math.max(...steps), season);
                  const reached = M.reachedCoast(x0, Math.max(...steps), season);
                  return {
                    start, steps: steps.map((n) => {
                      const s = M.stats(dists[n], start), a = M.likelyAreas(dists[n], [0.5, 0.9]);
                      const top = Array.from(dists[n].slice(0, M.nCells)).map((p, c) => [c, p]).sort((x, y) => y[1] - x[1]).slice(0, 5);
                      return { n, stats: s, mass: dists[n].reduce((x, y) => x + y, 0), top, reached: reached[n], shares: M.subregionShares(dists[n]),
                               areas: a.map((r) => ({ level: r.level, cells: r.cells })), interval: M.interval(start, "pct_left_box", n, season) };
                    }),
                  };
                }),
              });
            }
          }
        }
        out.textContent = JSON.stringify({ ok: true, cell_of: cellOf, results });
      } catch (e) {
        out.textContent = JSON.stringify({ ok: false, error: String(e) });
      }
    })();
  </script>
</body>
</html>
